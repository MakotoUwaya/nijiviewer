packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@heroui/shared-utils': true
  esbuild: true
  msw: true
  sharp: true
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - typescript
  - "@typescript/*"

overrides:
  "@react-aria/selection": 3.28.1
  storybook: 10.6.7
  "@vitest/browser": 5.1.1
  "@vitest/browser-playwright": 5.1.1
