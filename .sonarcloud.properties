# .github/workflows/pull_request.yml の playwright install コマンドは
# pnpm install ではなく Playwright ブラウザバイナリのダウンロードコマンドのため
# yaml:S6435 (Package managers should not run scripts on install) の誤検知を除外する
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=yaml:S6435
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/pull_request.yml
